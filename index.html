<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi 5 Wireless KVM Bridge</title>
    <style>
        body { font-family: sans-serif, system-ui; text-align: center; margin-top: 50px; background: #121212; color: #e0e0e0; }
        button { padding: 12px 24px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #45a049; }
        #status { margin: 20px 0; font-weight: bold; color: #ffa726; }
        textarea { width: 80%; max-width: 500px; height: 120px; font-size: 16px; padding: 10px; margin-top: 15px; background: #1e1e1e; color: #fff; border: 1px solid #444; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>Raspberry Pi 5 Wireless KVM</h2>
    <div id="status">Status: Disconnected</div>
    <button id="connectBtn">Connect to ESP32-C3</button>
    
    <br><br>
    <p>Type below to send keystrokes directly to the Pi 5:</p>
    <textarea id="inputBox" placeholder="Click here and type your commands..." disabled></textarea>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice;
        let rxCharacteristic;
        let isSending = false;

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const inputBox = document.getElementById('inputBox');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Connecting...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pi_KVM_Bridge' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);

                statusDiv.innerText = "Status: Connected & Ready!";
                statusDiv.style.color = "#66bb6a";
                connectBtn.style.display = "none";
                inputBox.disabled = false;
                inputBox.focus();
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Status: Connection Failed / Cancelled";
                statusDiv.style.color = "#ef5350";
            }
        });

        async function sendToBridge(stringData) {
            if (!rxCharacteristic || isSending) return;
            isSending = true;
            try {
                const encoder = new TextEncoder();
                // Using writeValue (with response) guarantees delivery tracking across platforms
                await rxCharacteristic.writeValue(encoder.encode(stringData));
            } catch (err) {
                console.error("BLE Send Error:", err);
            } finally {
                isSending = false;
            }
        }

        inputBox.addEventListener('input', async (event) => {
            const textToSend = event.target.value;
            const lastChar = textToSend.slice(-1);
            
            if (textToSend.length > 50) {
                inputBox.value = lastChar;
            }
            await sendToBridge(lastChar);
        });

        inputBox.addEventListener('keydown', async (event) => {
            let sendVal = "";
            if (event.key === "Enter") {
                sendVal = "\n";
            } else if (event.key === "Backspace") {
                sendVal = "\b";
            }

            if (sendVal) {
                event.preventDefault();
                await sendToBridge(sendVal);
            }
        });
    </script>

</body>
</html>
